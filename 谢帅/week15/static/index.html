<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>代码审查员 Subagent · 并行审查可视化</title>
<style>
  :root {
    --bg:#060912; --panel:rgba(20,30,55,0.55); --panel-solid:#0e1530;
    --border:rgba(0,212,255,0.18); --cyan:#00d4ff; --blue:#4f8cff;
    --orange:#ffb020; --green:#2ee6a0; --red:#ff5c7a;
    --text:#d6e2f5; --muted:#7a8db5;
  }
  * { box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",Calibri,sans-serif; margin:0; color:var(--text);
         background:linear-gradient(135deg,#060912 0%,#0a1228 50%,#060912 100%);
         min-height:100vh; }
  .wrap { max-width:1300px; margin:0 auto; padding:16px; }
  h1 { margin:0 0 2px; font-size:22px; font-weight:700;
       background:linear-gradient(90deg,#00d4ff,#4f8cff,#b4a0ff);
       -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px;
          padding:14px; margin-bottom:12px; backdrop-filter:blur(6px);
          box-shadow:0 0 24px rgba(0,120,200,0.05) inset, 0 4px 18px rgba(0,0,0,.35); }
  textarea { width:100%; border:1px solid var(--border); border-radius:7px; padding:10px;
            font-size:14px; background:rgba(8,14,30,0.7); color:var(--text); }
  textarea:focus { outline:none; border-color:var(--cyan); box-shadow:0 0 0 2px rgba(0,212,255,.15); }
  .ctrl { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  button { background:linear-gradient(135deg,#1b3a7a,#2a5cd6); color:#fff; border:none;
           border-radius:6px; padding:7px 15px; cursor:pointer; font-size:13px;
           box-shadow:0 0 12px rgba(79,140,255,.25); transition:.2s; }
  button:hover { box-shadow:0 0 18px rgba(0,212,255,.5); transform:translateY(-1px); }
  button:disabled { background:#2a3354; box-shadow:none; cursor:default; opacity:.6; }
  .ex { background:rgba(20,40,80,.6); border:1px solid var(--border); color:var(--cyan);
        box-shadow:none; }
  .ex:hover { background:rgba(0,90,140,.4); }
  .spinner { width:14px; height:14px; border:2px solid rgba(0,212,255,.2);
             border-top:var(--cyan); border-radius:50%; animation:spin .8s linear infinite; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .grid { display:grid; grid-template-columns: 400px 1fr; gap:12px; }
  .nodesel { font-size:11px; color:var(--muted); margin-bottom:8px; display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
  .nodebtn { font-size:11px; padding:3px 9px; margin:2px; border-radius:10px;
             background:rgba(30,50,90,.5); color:var(--text); border:1px solid transparent; cursor:pointer; }
  .nodebtn.on { background:linear-gradient(135deg,#00d4ff,#4f8cff); color:#06122a; font-weight:700;
                box-shadow:0 0 10px rgba(0,212,255,.5); }
  .feed { max-height:560px; overflow-y:auto; padding-right:4px; }
  .feed::-webkit-scrollbar { width:6px; }
  .feed::-webkit-scrollbar-thumb { background:rgba(0,212,255,.3); border-radius:3px; }
  .step { border-left:3px solid var(--blue); background:rgba(10,18,40,.6);
          margin:6px 0; padding:7px 11px; border-radius:4px; font-size:12px; }
  .step.main { border-left-color:var(--cyan); }
  .step.done { opacity:.85; }
  .step .nbadge { display:inline-block; font-size:9px; padding:1px 7px; border-radius:8px;
                   background:rgba(0,212,255,.15); color:var(--cyan); margin-right:6px; }
  .step.sub .nbadge { background:rgba(79,140,255,.18); color:var(--blue); }
  .step .thought { color:#9fb4e0; font-style:italic; margin:2px 0; }
  .step .act { color:var(--orange); font-weight:700; margin:2px 0; }
  .step .obs { color:#aab8d8; white-space:pre-wrap; word-break:break-word;
               max-height:120px; overflow-y:auto; background:rgba(4,8,20,.5);
               padding:4px 6px; border-radius:3px; margin-top:3px;
               font-family:Consolas,monospace; font-size:11px; }
  .step .fa { color:var(--green); font-weight:700; }
  .ans { font-size:14px; line-height:1.75; }
  /* ── 报告 markdown 渲染样式 ── */
  .ans .md-h { color:var(--cyan); margin:14px 0 6px; line-height:1.4; border-bottom:1px solid var(--border); padding-bottom:4px; }
  .ans h2.md-h { font-size:18px; }
  .ans h3.md-h { font-size:16px; color:var(--blue); border-bottom:none; }
  .ans h4.md-h, .ans h5.md-h { font-size:14px; color:var(--blue); border-bottom:none; }
  .ans .md-p { margin:6px 0; }
  .ans .md-ul, .ans .md-ol { margin:6px 0; padding-left:22px; }
  .ans .md-ul li, .ans .md-ol li { margin:3px 0; }
  .ans .md-ul { list-style:none; padding-left:14px; }
  .ans .md-ul li::before { content:"▸ "; color:var(--cyan); }
  .ans strong { color:#fff; font-weight:700; }
  .ans em { color:#b4a0ff; font-style:italic; }
  .ans .md-code { font-family:Consolas,monospace; font-size:12px; background:rgba(0,212,255,.1);
                  color:var(--cyan); padding:1px 5px; border-radius:3px; }
  .ans .md-pre { background:rgba(4,8,20,.7); border:1px solid var(--border); border-radius:6px;
                 padding:10px 12px; overflow-x:auto; margin:8px 0; }
  .ans .md-pre code { font-family:Consolas,monospace; font-size:12px; color:#aab8d8; white-space:pre; }
  .ans .md-hr { border:none; border-top:1px solid var(--border); margin:12px 0; }
  /* 审查严重级别标签着色 */
  .ans .sev { font-weight:700; padding:0 4px; border-radius:3px; }
  .ans .sev-high { color:var(--red); background:rgba(255,92,122,.12); }
  .ans .sev-mid { color:var(--orange); background:rgba(255,176,32,.12); }
  .ans .sev-low { color:var(--green); background:rgba(46,230,160,.12); }
  .stats { font-size:12px; color:var(--green); margin-top:8px; padding:6px 10px;
           background:rgba(46,230,160,.08); border-radius:5px; border:1px solid rgba(46,230,160,.2); }
  .status-tag { font-size:10px; padding:1px 7px; border-radius:8px; margin-left:6px; }
  .status-running { background:rgba(255,176,32,.18); color:var(--orange); }
  .status-done { background:rgba(46,230,160,.18); color:var(--green); }
</style>
</head>
<body>
<div class="wrap">
  <h1>▮ 代码审查员 Subagent · 并行审查可视化</h1>
  <div class="sub">主 agent 扫描目录挑文件 · 每个文件派一个审查员并行审 · 左拓扑右实时过程流 · 凸显并行加速</div>

  <div class="card">
    <textarea id="q" rows="2" placeholder="输入待审查的项目目录路径，如 E:/study/code/week15/homework/sample_project">E:/study/code/week15/homework/sample_project</textarea>
    <div class="ctrl">
      <button id="ask" onclick="ask()">▶ 开始审查</button>
      <div id="spin" class="spinner"></div>
      <span style="font-size:12px;color:var(--muted)">示例：</span>
      <button class="ex" onclick="fill('E:/study/code/week15/homework/sample_project')">示例待审项目</button>
      <button class="ex" onclick="fill('E:/study/code/week15/homework/src')">审查本项目 src</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3 style="margin:0 0 8px;font-size:14px;color:var(--cyan)">◆ 审查拓扑</h3>
      <div id="topo"></div>
      <div class="stats" id="stats" style="display:none"></div>
    </div>
    <div class="card">
      <div class="nodesel" id="nodesel"></div>
      <div class="feed" id="feed"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px;font-size:14px;color:var(--cyan)">◆ 最终审查报告</h3>
    <div id="ans" class="ans">（执行后显示）</div>
  </div>
</div>

<script src="/static/viz/topology.js"></script>
<script>
let topo = null;
let allSteps = [];          // 全局有序步骤流：[{node, nodeType, step}]
let traces = {};            // {nodeId: [step]}
let nodeMeta = {};          // {id: {topic, status}}
let currentNode = 'all';    // 'all' 或某 node id
let autoFollow = true;      // 是否自动滚动到底
let subTopics = {};         // {reviewer_id: file_path}

function fill(q) { document.getElementById('q').value = q; }

async function ask() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const btn = document.getElementById('ask'), spin = document.getElementById('spin');
  btn.disabled = true; spin.style.display = 'inline-block';
  document.getElementById('ans').textContent = '（审查中…）';
  document.getElementById('stats').style.display = 'none';
  // 重置：整体换图 + 清空流
  allSteps = []; traces = {}; nodeMeta = {}; subTopics = {};
  currentNode = 'all'; autoFollow = true;
  topo = new TopoViz(document.getElementById('topo'));
  topo.setMain();
  topo.onClick(id => selectNode(id));
  nodeMeta['main'] = { topic:'主 agent', status:'idle' };
  traces['main'] = [];
  refreshNodeSel();
  document.getElementById('feed').innerHTML = '';

  try {
    const resp = await fetch('/review', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({project_dir: q}) });
    const reader = resp.body.getReader(); const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n\n'); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith('data:')) continue;
        const ev = JSON.parse(ln.slice(5).trim());
        handleEvent(ev);
      }
    }
  } catch (e) {
    appendStep('main', {action:'error', observation:String(e), final:false});
  } finally {
    btn.disabled = false; spin.style.display = 'none';
  }
}

function handleEvent(ev) {
  if (ev.type === 'main_step') {
    pushStep('main', 'main', ev);
    topo.markRunning('main');
    nodeMeta['main'].status = ev.final ? 'done' : 'running';
  } else if (ev.type === 'dispatch') {
    ev.reviewer_ids.forEach((id, i) => {
      subTopics[id] = ev.file_paths[i] || id;
      traces[id] = []; nodeMeta[id] = { topic: subTopics[id], status:'running' };
      topo.addSubagent(id, shortName(subTopics[id]));
      topo.markRunning(id);
    });
    refreshNodeSel();
  } else if (ev.type === 'reviewer_step') {
    pushStep(ev.reviewer_id, 'sub', ev);
    topo.markRunning(ev.reviewer_id);
  } else if (ev.type === 'reviewer_done') {
    topo.markDone(ev.reviewer_id);
    if (nodeMeta[ev.reviewer_id]) nodeMeta[ev.reviewer_id].status = 'done';
    refreshNodeSel();
  } else if (ev.type === 'final') {
    document.getElementById('ans').innerHTML = renderMarkdown(ev.answer || '(无)');
    if (ev.parallel_stats && ev.parallel_stats.length) {
      const s = ev.parallel_stats[ev.parallel_stats.length-1];
      const el = document.getElementById('stats');
      el.innerHTML = `⚡ 并行：${s.n_reviewers} 个审查员 · wall-clock <b style="color:var(--cyan)">${s.wall_clock}s</b> `
        + `vs 串行 ${s.serial_sum}s · 加速 <b style="color:var(--green)">${s.speedup}×</b>`;
      el.style.display = 'block';
    }
    topo.markDone('main');
    if (nodeMeta['main']) nodeMeta['main'].status = 'done';
    refreshNodeSel();
  }
}

// 从文件路径取短名（末段文件名）作为节点标签
function shortName(fpath) {
  if (!fpath) return '?';
  const parts = String(fpath).replace(/\\/g,'/').split('/');
  return parts[parts.length-1] || fpath;
}

function pushStep(node, nodeType, step) {
  if (!traces[node]) { traces[node] = []; nodeMeta[node] = {topic: subTopics[node]||node, status:'running'}; }
  // ⚠️ 去重 by idx：pre-step(observation=null) 和 post-step(带 observation) 共享 idx，
  //    post 到达时原地更新，不重复 append
  const tIdx = traces[node].findIndex(s => s.idx === step.idx);
  if (tIdx >= 0) traces[node][tIdx] = step; else traces[node].push(step);
  const aIdx = allSteps.findIndex(s => s.node === node && s.step.idx === step.idx);
  if (aIdx >= 0) allSteps[aIdx] = { node, nodeType, step };
  else allSteps.push({ node, nodeType, step });
  renderFeed();
}

function selectNode(id) {
  currentNode = id; autoFollow = (id === 'all');
  refreshNodeSel();
  renderFeed();
}

function refreshNodeSel() {
  const sel = document.getElementById('nodesel');
  let html = '<span style="opacity:.6">节点：</span>';
  html += `<button class="nodebtn${currentNode==='all'?' on':''}" onclick="selectNode('all')">全部实时流</button>`;
  const ids = ['main', ...Object.keys(subTopics)];
  ids.forEach(id => {
    const m = nodeMeta[id] || {};
    const tag = m.status === 'done' ? '<span class="status-tag status-done">done</span>'
              : m.status === 'running' ? '<span class="status-tag status-running">run</span>' : '';
    const lbl = id === 'main' ? '主agent' : shortName(m.topic||id).slice(0,14);
    html += `<button class="nodebtn${currentNode===id?' on':''}" onclick="selectNode('${id}')">${lbl}${tag}</button>`;
  });
  sel.innerHTML = html;
}

function renderFeed() {
  const box = document.getElementById('feed');
  let steps;
  if (currentNode === 'all') steps = allSteps;
  else steps = (traces[currentNode]||[]).map(s => ({node:currentNode, nodeType: currentNode==='main'?'main':'sub', step:s}));
  let html = '';
  steps.forEach(({node, nodeType, step: s}) => {
    const isMain = nodeType === 'main';
    const lbl = isMain ? '主agent' : shortName(nodeMeta[node]?.topic || node);
    const cls = isMain ? 'step main' : 'step sub';
    const t = s.thought ? `<div class="thought">💭 ${s.thought}</div>` : '';
    const a = s.action ? `<div class="act">🔧 ${s.action}${s.action_input ? '(' + s.action_input.slice(0,55) + ')' : ''}</div>` : '';
    const o = s.observation ? `<div class="obs">👁 ${s.observation}</div>`
            : (!s.final ? '<div class="obs" style="color:var(--orange)">⏳ 执行中…</div>' : '');
    const fa = s.final ? '<div class="fa">✓ Final Answer</div>' : '';
    html += `<div class="${cls}"><span class="nbadge">${lbl}</span>${t}${a}${o}${fa}</div>`;
  });
  if (!steps.length) html = '<div style="color:var(--muted);font-size:12px;padding:8px">等待步骤流…（点左侧节点可只看该节点）</div>';
  box.innerHTML = html;
  if (autoFollow) box.scrollTop = box.scrollHeight;
}

// ── 轻量 markdown 渲染（零依赖手写，离线可用）──
// LLM 输出属不可信数据：先整体 HTML 转义防 XSS，再套用 markdown 语法。
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// 行内元素：粗体/斜体/行内代码/审查严重级别标签
function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, '<code class="md-code">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    // 审查报告严重级别：[高]/[中]/[低] 着色（reviewer 输出格式）
    .replace(/\[\s*(?:严重级别\s*)?高\s*\]/g, '<span class="sev sev-high">[高]</span>')
    .replace(/\[\s*(?:严重级别\s*)?中\s*\]/g, '<span class="sev sev-mid">[中]</span>')
    .replace(/\[\s*(?:严重级别\s*)?低\s*\]/g, '<span class="sev sev-low">[低]</span>');
}
function renderMarkdown(src) {
  const lines = escapeHtml(src).split('\n');
  let html = '', i = 0;
  let listType = null;  // 'ul' | 'ol' | null
  const closeList = () => { if (listType) { html += `</${listType}>`; listType = null; } };
  while (i < lines.length) {
    let ln = lines[i];
    // 代码块围栏 ```
    const fence = ln.match(/^\s*```(\w*)\s*$/);
    if (fence) {
      closeList();
      const body = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { body.push(lines[i]); i++; }
      i++; // 跳过收尾 ```
      html += `<pre class="md-pre"><code>${body.join('\n')}</code></pre>`;
      continue;
    }
    // 标题 ## / ### / #### / #####
    const h = ln.match(/^(#{2,5})\s+(.*)$/);
    if (h) { closeList(); const lv = h[1].length; html += `<h${lv} class="md-h">${inlineMd(h[2])}</h${lv}>`; i++; continue; }
    // 分隔线
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) { closeList(); html += '<hr class="md-hr">'; i++; continue; }
    // 无序列表 - / *
    const ul = ln.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { if (listType !== 'ul') { closeList(); html += '<ul class="md-ul">'; listType = 'ul'; } html += `<li>${inlineMd(ul[1])}</li>`; i++; continue; }
    // 有序列表 1.
    const ol = ln.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) { if (listType !== 'ol') { closeList(); html += '<ol class="md-ol">'; listType = 'ol'; } html += `<li>${inlineMd(ol[1])}</li>`; i++; continue; }
    // 空行
    if (/^\s*$/.test(ln)) { closeList(); i++; continue; }
    // 普通段落
    closeList();
    html += `<p class="md-p">${inlineMd(ln)}</p>`;
    i++;
  }
  closeList();
  return html;
}
</script>
</body>
</html>
