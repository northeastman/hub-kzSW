<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1242px; height: 1656px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #F4F7FD 0%, #EAF0FA 55%, #E2EAF7 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 1110px; height: 1536px;
    background: #FFFFFF;
    border-radius: 48px;
    padding: 70px 64px 56px;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(46, 116, 181, 0.16);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 12px;
    background: linear-gradient(90deg, #2E74B5, #6B9FD4);
  }
  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 34px;
  }
  .pill {
    display: inline-block;
    background: #E8F1FB;
    color: #2E74B5;
    font-size: 26px; font-weight: 700;
    padding: 12px 28px;
    border-radius: 999px;
    letter-spacing: 2px;
  }
  .day {
    color: #8AA3C0; font-size: 24px; font-weight: 700; letter-spacing: 2px;
  }
  .topic-tag {
    color: #6B9FD4; font-size: 30px; font-weight: 700; letter-spacing: 4px;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 64px; font-weight: 800; color: #1D2B3D;
    letter-spacing: 2px; line-height: 1.3; margin-bottom: 22px;
    overflow: visible;
  }
  .lead {
    font-size: 34px; font-weight: 500; color: #51637A;
    line-height: 1.5; margin-bottom: 34px;
    padding-bottom: 28px;
    border-bottom: 2px solid #E8EEF6;
  }
  .points { flex: 1; display: flex; flex-direction: column; gap: 22px; }
  .point {
    display: flex; gap: 24px;
    background: #F7FAFE;
    border-radius: 24px;
    padding: 24px 28px;
  }
  .num {
    flex: 0 0 52px; width: 52px; height: 52px;
    background: #2E74B5; color: #FFFFFF;
    font-size: 28px; font-weight: 800;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .point-body { flex: 1; }
  .point-title { font-size: 30px; font-weight: 700; color: #1D2B3D; margin-bottom: 6px; }
  .point-desc { font-size: 26px; font-weight: 400; color: #51637A; line-height: 1.45; }
  .quote {
    margin-top: 30px;
    background: linear-gradient(90deg, #2E74B5, #4E8BC9);
    color: #FFFFFF;
    font-size: 30px; font-weight: 700;
    border-radius: 24px;
    padding: 26px 34px;
    text-align: center;
    letter-spacing: 1px;
  }
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 26px;
    color: #8AA3C0; font-size: 24px; font-weight: 600;
    letter-spacing: 2px;
  }
  .footer .brand { color: #2E74B5; font-weight: 800; }
</style>
</head>
<body>
  <div class="card">
    <div class="top-row">
      <span class="pill">AI产品经理 · 每日知识卡</span>
      <span class="day">{{DAY}}</span>
    </div>
    <div class="topic-tag">{{TOPIC_TAG}}</div>
    <h1>{{TITLE}}</h1>
    <div class="lead">{{LEAD}}</div>
    <div class="points">
{{POINTS}}
    </div>
    <div class="quote">{{QUOTE}}</div>
    <div class="footer">
      <span class="brand">AI 产品经理知识地图</span>
      <span>{{MODULE_PROGRESS}}{{PROGRESS}} · {{DATE}}</span>
    </div>
  </div>
</body>
</html>
